<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sign-up-container" id="signupSection" style="display:none">
    <h2>Create Account</h2>
    <form id="signupForm">
        <input type="text" id="suUsername" placeholder="Username" required>
        <input type="email" id="suEmail" placeholder="Email (e.g. user@gmail.com)" required>
        <input type="password" id="suPassword" placeholder="Password" required>
        <button type="submit" class="button-signup">Sign Up</button>
        <nav>
            <a href="#" id="showLogin">Back to Login</a>
        </nav>
    </form>
</div>


<script src="script.js"></script>
</body>
</html>
